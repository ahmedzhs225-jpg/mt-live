<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مستري تاون | البثوث اللايف</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07050e;
      --card: rgba(255, 255, 255, 0.03);
      --border: rgba(255, 255, 255, 0.06);
      --orange: #ff6b00;
      --orange2: #ff2d00;
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.45);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(255, 100, 0, 0.22) 0%, transparent 55%),
        radial-gradient(ellipse 70% 40% at 90% 110%, rgba(255, 40, 0, 0.14) 0%, transparent 50%);
      z-index: -1;
      pointer-events: none;
    }

    .app {
      max-width: 440px;
      margin: 0 auto;
      padding-bottom: 50px;
    }

    /* Header */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 18px 18px 14px;
      background: rgba(7, 5, 14, 0.82);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border-bottom: 1px solid rgba(255, 107, 0, 0.1);
    }

    .search {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 16px;
      padding: 12px 16px;
      margin-bottom: 18px;
      transition: 0.25s;
    }

    .search:focus-within {
      border-color: rgba(255, 107, 0, 0.5);
      background: rgba(255, 107, 0, 0.06);
      box-shadow: 0 0 0 4px rgba(255, 107, 0, 0.1);
    }

    .search input {
      width: 100%;
      background: transparent;
      border: none;
      color: white;
      font-size: 15px;
      outline: none;
    }

    .search input::placeholder {
      color: rgba(255, 255, 255, 0.35);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #ff6b00, #ff2d00);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 22px;
      color: white;
      box-shadow: 0 10px 28px rgba(255, 80, 0, 0.4);
      position: relative;
    }

    .logo::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 16px;
      padding: 1.5px;
      background: linear-gradient(135deg, rgba(255,255,255,0.35), transparent 60%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
    }

    .brand h1 {
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(90deg, #ff9a2e, #ff3c00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.4px;
    }

    .brand p {
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* Welcome */
    .welcome {
      margin: 16px 18px;
      padding: 13px 16px;
      background: linear-gradient(90deg, rgba(255, 100, 0, 0.15), rgba(255, 40, 0, 0.06));
      border: 1px solid rgba(255, 100, 0, 0.2);
      border-radius: 16px;
      font-size: 13.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .live-dot {
      width: 9px;
      height: 9px;
      background: #ff3b30;
      border-radius: 50%;
      flex-shrink: 0;
      animation: pulse 1.7s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.55); }
      70% { box-shadow: 0 0 0 9px rgba(255, 59, 48, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
    }

    /* Cards */
    .streams {
      padding: 0 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      overflow: hidden;
      backdrop-filter: blur(12px);
      transition: transform 0.22s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 120, 0, 0.45), transparent);
    }

    .card:active {
      transform: scale(0.975);
    }

    .card-top {
      display: flex;
      align-items: center;
      padding: 16px 16px 8px;
      gap: 13px;
    }

    .avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff6b00, #ff2d00);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 20px;
      color: white;
      box-shadow: 0 6px 16px rgba(255, 80, 0, 0.3);
      flex-shrink: 0;
    }

    .info {
      flex: 1;
      min-width: 0;
    }

    .name-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .name {
      font-weight: 700;
      font-size: 16px;
    }

    .badge {
      background: linear-gradient(90deg, #ff3b30, #ff0a0a);
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 30px;
      letter-spacing: 0.3px;
      box-shadow: 0 0 12px rgba(255, 50, 30, 0.4);
    }

    .time {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.38);
      margin-top: 3px;
    }

    .title {
      padding: 0 16px 12px;
      font-size: 14.5px;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.88);
    }

    .stats {
      display: flex;
      gap: 18px;
      padding: 11px 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 13px;
      color: rgba(255, 255, 255, 0.45);
    }

    .btn {
      display: block;
      background: linear-gradient(90deg, #ff6b00, #ff2d00);
      color: white;
      text-align: center;
      padding: 13px;
      margin: 0 16px 16px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 700;
      font-size: 14.5px;
      box-shadow: 0 8px 22px rgba(255, 80, 0, 0.32);
    }

    /* Empty State */
    .empty {
      text-align: center;
      padding: 70px 28px;
    }

    .empty-icon {
      font-size: 52px;
      margin-bottom: 18px;
      opacity: 0.9;
    }

    .empty-title {
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .empty-text {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.4);
      line-height: 1.65;
    }

    .footer {
      text-align: center;
      padding: 30px 20px 10px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>
